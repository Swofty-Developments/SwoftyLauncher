name: Release binaries

# The release build of the swofty CLI, the launcher and Swofty UI for Linux and Windows. CI calls it on every
# push to main, on EC2 runners when they start, and a tag on that commit takes the binaries from that run
# instead of building again (release.yml). The release workflow calls it itself, on hosted runners, only when
# it finds none. CI's call also builds the installer people test, so main needs no separate installer build.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to build
        type: string
        required: true
      retention-days:
        description: How long the binaries stay on the run
        type: number
        default: 1
      linux-runner:
        description: The runner label for the Linux build; CI passes an EC2 runner of the same Ubuntu release
        type: string
        default: ubuntu-22.04
      windows-runner:
        description: The runner label for the Windows build
        type: string
        default: windows-latest
      installer:
        description: Also build the installer and upload it as installer-Linux and installer-Windows
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-build:
    name: Linux build
    # The oldest supported runner gives the oldest glibc baseline, for SteamOS.
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # No Rust cache: on an EC2 runner a cold release build takes about as long as restoring one. GTK and
      # WebKitGTK are for the swofty-ads helper, which hosts the launcher's ad slots on Linux.
      - uses: ./.github/actions/setup-rust

      # The binaries the release ships, not the installer or the addon template.
      # The log server "Send Logs to Developers" uploads to; without it the button is disabled.
      # The usage address is where anonymised usage reports go; builds without it send none.
      # The ads address serves the launcher's ad slots; builds without it show none.
      - name: Build
        run: cargo build --release -p swofty-cli -p swofty-launcher -p swofty-ads-helper
        env:
          SWOFTY_LOGS_URL: https://api.f1.swofty.net/v1/logs
          SWOFTY_USAGE_URL: https://api.f1.swofty.net
          SWOFTY_ADS_URL: https://ads.swofty.net

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build Swofty UI
        run: |
          python -m pip install pyinstaller==6.22.3
          python tools/swofty-ui/build.py
          dist/swofty-ui/swofty-ui --self-test

      # Artefacts drop the executable bit, so the binaries travel in a tar.
      - name: Bundle the binaries
        run: tar cf linux-binaries.tar target/release/swofty target/release/swofty-launcher target/release/swofty-ads dist/swofty-ui/swofty-ui

      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: linux-binaries.tar
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # The installer as ci.yml's pull request Installer job builds it: without the server addresses, and in a
      # cargo run of its own, so that its features cannot change the binaries above. It comes after their
      # upload; rebuilding swofty-core without the addresses leaves the linked binaries as they are.
      - name: Build the installer
        if: inputs.installer
        run: cargo build --release -p swofty-launcher-installer

      - name: Upload the installer
        if: inputs.installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: target/release/swofty-launcher-installer
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Windows build
    runs-on: ${{ inputs.windows-runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # No Rust cache: on an EC2 runner a cold release build takes about as long as restoring one.
      - uses: ./.github/actions/setup-rust

      # Only the two binaries the release ships, not the installer or the addon template.
      # The log server "Send Logs to Developers" uploads to; without it the button is disabled.
      # The usage address is where anonymised usage reports go; builds without it send none.
      # The ads address serves the launcher's ad slots; builds without it show none.
      - name: Build
        run: cargo build --release -p swofty-cli -p swofty-launcher
        env:
          SWOFTY_LOGS_URL: https://api.f1.swofty.net/v1/logs
          SWOFTY_USAGE_URL: https://api.f1.swofty.net
          SWOFTY_ADS_URL: https://ads.swofty.net

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build Swofty UI
        run: python tools/swofty-ui/build.py

      - name: Self-test Swofty UI
        run: dist/swofty-ui/swofty-ui.exe --self-test

      # The artefact keeps the paths below the checkout, target/release/ and dist/swofty-ui/.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: |
            target/release/swofty.exe
            target/release/swofty-launcher.exe
            dist/swofty-ui/swofty-ui.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # The installer as ci.yml's pull request Installer job builds it: without the server addresses, and in a
      # cargo run of its own, so that its features cannot change the binaries above. It comes after their
      # upload; rebuilding swofty-core without the addresses leaves the linked binaries as they are.
      - name: Build the installer
        if: inputs.installer
        run: cargo build --release -p swofty-launcher-installer

      - name: Upload the installer
        if: inputs.installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: target/release/swofty-launcher-installer.exe
          if-no-files-found: error
          retention-days: 14
