name: CI

on:
  pull_request:
  push:
    branches: [main, ci/parallel-native]

# A newer push to a pull request cancels its older run. Every push to main runs to the end in its own group:
# a release tag needs its commit's run to pass.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request runs only the jobs whose files it changes; a push to main runs every job.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      installer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.installer == 'true' }}
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      swofty-ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.swofty-ui == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      std: ${{ github.event_name != 'pull_request' || steps.filter.outputs.std == 'true' }}
      compat: ${{ github.event_name != 'pull_request' || steps.filter.outputs.compat == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Every area: this workflow, and the line-ending rules every checkout applies.
            always: &always
              - .github/workflows/ci.yml
              - .gitattributes
            # Every crate, plus the files outside them that the crates embed or their tests read.
            rust:
              - *always
              - '**/*.rs'
              - '**/Cargo.toml'
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - apps/**
              - packages/**
              - installer/**
              - templates/**
              - addons/builtins/**
              - addons/swoftymod/**
              - addons/custom-grid-size/**
              - re/db/functions.tsv
              - tools/gamedb/catalog/**
            # The installer crate, its path dependencies (swofty-core, -addon, -formats, -sdk) and what they embed.
            installer:
              - *always
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - installer/**
              - packages/core/**
              - packages/addon-api/**
              - packages/formats/**
              - packages/sdk/**
              - tools/gamedb/catalog/**
              - templates/addon/native/include/**
              - addons/swoftymod/swofty.json
              - apps/launcher/assets/**
            # native/build.sh bundles the whole re-optimization addon, so its manifest and README count too.
            native:
              - *always
              - native/**
              - re/**
              - addons/*/native/**
              - addons/re-optimization/**
              - packages/sdk/**
              - tools/pack_addon.py
              - tools/rtassets.py
              - templates/std/**
              - tools/std/templates.py
            # build.py puts tools/ on the module path; the app imports erp, pkg and idf from there.
            swofty-ui:
              - *always
              - tools/swofty-ui/**
              - tools/erp.py
              - tools/pkg.py
              - tools/idf.py
            docs:
              - *always
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            # The registry schemas and examples, the tools that check them, the templates whose data files they validate, and the
            # venues table with the Classic Seasons calendars made from it.
            std:
              - *always
              - packages/sdk/std/**
              - tools/std/**
              - templates/std/**
              - addons/classicseasons/*/registry/**
              - addons/classicseasons/classic-seasons/tools/calendars.py
              - addons/classicseasons/test/calendars.py
              - addons/progressive/data/rounds.json
            compat:
              - *always
              - tools/compat/**

  # A push to main starts its heavy jobs on EC2 spot instances that take one job each and terminate
  # (.github/runners). Pull requests, and any launch that fails, get the hosted runner labels instead.
  ec2:
    name: EC2 runners
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      native: ${{ steps.launch.outputs.native || 'ubuntu-latest' }}
      rust-linux: ${{ steps.launch.outputs.rust-linux || 'ubuntu-latest' }}
      rust-windows: ${{ steps.launch.outputs.rust-windows || 'windows-latest' }}
      release-linux: ${{ steps.launch.outputs.release-linux || 'ubuntu-22.04' }}
      release-windows: ${{ steps.launch.outputs.release-windows || 'windows-latest' }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/runners

      - id: aws
        if: github.event_name == 'push'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::532818875494:role/swofty-launcher-ci-runners
          aws-region: ap-south-2

      # All five at once. m8a has a whole core per vCPU; Windows pays for its licence per vCPU, so it stops at 16.
      - id: launch
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: |
          linux=m8a.8xlarge,c8i.8xlarge,c7i.8xlarge,m8a.4xlarge
          windows=m8a.4xlarge,c8i.4xlarge,c7i.4xlarge
          .github/runners/launch.sh native linux-2604 "$linux" ubuntu-latest &
          .github/runners/launch.sh rust-linux linux-2604 "$linux" ubuntu-latest &
          .github/runners/launch.sh rust-windows windows "$windows" windows-latest &
          .github/runners/launch.sh release-linux linux-2204 "$linux" ubuntu-22.04 &
          .github/runners/launch.sh release-windows windows "$windows" windows-latest &
          wait

  rust:
    name: Rust (${{ matrix.os }})
    needs: [changes, ec2]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os == 'windows-latest' && needs.ec2.outputs.rust-windows || needs.ec2.outputs.rust-linux }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      # Only main saves, so pull requests restore main's caches instead of evicting them with their own.
      # The environment hash would fold in every installed rustc, and runner images differ in the stable
      # one they preinstall; the key keeps the lockfile and rust-toolchain.toml hash, which is what matters.
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: workspace-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # The launcher and the installer are not default members; --workspace reaches them too.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --workspace takes in the launcher's and the installer's tests too. The real-file round trips skip
      # without F1_25_DIR; CI has no game files. --no-fail-fast reports every failing test binary in one run.
      - name: Test
        run: cargo test --workspace --no-fail-fast

  swofty-ui:
    name: Swofty UI (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.swofty-ui == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Self-test from source
        run: python tools/swofty-ui/serve.py --self-test

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build the executable
        run: python tools/swofty-ui/build.py

      - name: Self-test the executable
        run: dist/swofty-ui/swofty-ui --self-test

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: swofty-ui-${{ runner.os }}
          path: dist/swofty-ui/swofty-ui*
          if-no-files-found: error
          retention-days: 14

  # The gate needs a game folder; its comparison logic runs here against a fake swofty.
  compat:
    name: Compatibility gate tool
    needs: changes
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s tools/compat/tests -t tools/compat

  # The rust job lints the installer on both systems; this job builds the release binary people test.
  installer:
    name: Installer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          shared-key: installer-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release -p swofty-launcher-installer

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            target/release/swofty-launcher-installer
            target/release/swofty-launcher-installer.exe
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          require-lockfile: true

      - name: Build
        run: pnpm --filter @f1modmanager/docs docs:build

  std:
    name: Standard library schemas
    needs: changes
    if: needs.changes.outputs.std == 'true'
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags: schemacheck reads the schema files of the last release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Schema tooling tests
        run: python3 -m unittest discover -s tools/std/tests

      # Schema files at the last v* tag before the merge base are released and must be unchanged; every new
      # minor may only add to the one before it, and every new major declares its adapter.
      - name: Schema versions
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 tools/std/schemacheck.py --released-before "$(git merge-base "$BASE" HEAD)"

      - name: Registry examples and must-fail cases
        run: python3 tools/std/validate.py

      # The native job builds the templates; this checks their registry data files against the schemas.
      - name: Template data files
        run: python3 tools/std/templates.py --no-build

      # The venues table, and each Classic Seasons season's calendar against Progressive's rounds and the schemas.
      - name: Venues and Classic Seasons calendars
        run: python3 addons/classicseasons/test/calendars.py

  native:
    name: Native loader and Wine test
    needs: [changes, ec2]
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ needs.ec2.outputs.native }}
    steps:
      - uses: actions/checkout@v7

      # Only the Wine tests need these, so the install runs in the background while the build and unit tests do.
      - name: Start installing Wine and Xvfb
        run: |
          (
            set +e
            sudo dpkg --add-architecture i386 &&
              sudo apt-get update &&
              sudo apt-get install -y wine64 wine xvfb
            echo $? > "$RUNNER_TEMP/wine-install.status"
          ) > "$RUNNER_TEMP/wine-install.log" 2>&1 &

      # The binding generator, capture and verifier tests use only the standard library.
      - name: RE tools unit tests
        run: python3 -m unittest discover -s re/tools/tests

      # The native scripts pin their compilers to the maintainer's healthy cores (taskset -c 2-7,...),
      # which leaves two of a hosted runner's four. This shim drops the pin and runs the command as is.
      - name: Use every runner core
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/taskset" <<'EOF'
          #!/bin/sh
          [ "$1" = -c ] && shift 2
          exec "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/taskset"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The native tests run side by side, and the stock xvfb-run -a can give two calls started together the
      # same display. This one takes the next display number from a counter under a lock.
      - name: Give every xvfb-run its own display
        run: |
          cat > "$RUNNER_TEMP/bin/xvfb-run" <<'EOF'
          #!/bin/bash
          while [ "${1:-}" = -a ] || [ "${1:-}" = --auto-servernum ]; do shift; done
          n=$(flock "$RUNNER_TEMP/xvfb.lock" bash -c 'f=$RUNNER_TEMP/xvfb.next; n=$(cat "$f" 2>/dev/null || echo 100); echo $((n + 1)) > "$f"; echo "$n"')
          Xvfb ":$n" -screen 0 1280x1024x24 -nolisten tcp >/dev/null 2>&1 &
          x=$!
          for _ in $(seq 200); do [ -S "/tmp/.X11-unix/X$n" ] && break; sleep 0.05; done
          DISPLAY=":$n" "$@"
          rc=$?
          kill "$x" 2>/dev/null
          wait "$x" 2>/dev/null
          exit $rc
          EOF
          chmod +x "$RUNNER_TEMP/bin/xvfb-run"

      # The scripts below keep their own Zig cache under native/build, which the restore step covers.
      # The tool cache installs Zig at the same path every run; the MinGW and libc++ objects are keyed
      # on compiler arguments that include that path, so the default random temp folder missed them all.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
          use-tool-cache: true

      # The key starts over each month so the content-addressed cache cannot grow without bound.
      - name: Zig cache period
        id: zig-period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Zig cache
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            native/build/zig-cache
            addons/re-optimization/native/build/zig-cache
          key: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-${{ hashFiles('native/**', 'addons/*/native/**', 'packages/sdk/include/**') }}
          restore-keys: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-

      - name: Build version.dll, swofty_core.dll and the bundled addons
        run: native/build.sh

      - name: Bundled addon packages
        run: |
          python3 - <<'EOF'
          import glob, json, zipfile
          pkgs = sorted(glob.glob('native/bundled/*.swoftyaddon'))
          assert pkgs, 'native/build.sh packaged no bundled addons'
          for p in pkgs:
              z = zipfile.ZipFile(p)
              names = z.namelist()
              assert 'swofty.json' in names, f'{p}: no swofty.json at the root'
              m = json.loads(z.read('swofty.json'))
              for n in m.get('operations', {}).get('native', []):
                  assert n['dll'] in names, f"{p}: {n['dll']} is missing"
              assert not any(n.startswith('native/build/') for n in names), f'{p}: build files packaged'
              print(p, names)
          EOF

      - name: Wine and Xvfb
        timeout-minutes: 10
        run: |
          while [ ! -f "$RUNNER_TEMP/wine-install.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/wine-install.log"
          exit "$(cat "$RUNNER_TEMP/wine-install.status")"

      # Every host and Wine test, the templates build and the Any Team Transfers build, side by side; each
      # test's output is in its own group in the log, and the step fails on any failing test.
      - name: Native tests
        run: native/test/run_ci_tests.sh

      # Saved after the tests, which compile their fixtures into the same cache.
      - name: Save the Zig cache
        if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            native/build/zig-cache
            addons/re-optimization/native/build/zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

  # Every push to main also builds the release binaries: the run keeps the release cache warm, and a tag on
  # this commit takes its binaries from here (release.yml) instead of building again.
  release-binaries:
    name: Release binaries
    needs: ec2
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-binaries.yml
    with:
      ref: ${{ github.sha }}
      retention-days: 7
      linux-runner: ${{ needs.ec2.outputs.release-linux }}
      windows-runner: ${{ needs.ec2.outputs.release-windows }}

  # Release tags need this run to pass, so the cleanup never fails it.
  ec2-cleanup:
    name: EC2 cleanup
    needs: [ec2, rust, native, release-binaries]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/runners

      - id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::532818875494:role/swofty-launcher-ci-runners
          aws-region: ap-south-2

      - if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: .github/runners/cleanup.sh
