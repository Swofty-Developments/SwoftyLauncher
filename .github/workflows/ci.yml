name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. Every push to main runs to the end in its own group:
# a release tag needs its commit's run to pass.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request runs only the jobs whose files it changes; a push to main runs every job.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      installer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.installer == 'true' }}
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      swofty-ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.swofty-ui == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      std: ${{ github.event_name != 'pull_request' || steps.filter.outputs.std == 'true' }}
      compat: ${{ github.event_name != 'pull_request' || steps.filter.outputs.compat == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Every area: this workflow, the actions it shares, and the line-ending rules every checkout applies.
            always: &always
              - .github/workflows/ci.yml
              - .github/actions/**
              - .gitattributes
            # Every crate, plus the files outside them that the crates embed or their tests read.
            rust:
              - *always
              - '**/*.rs'
              - '**/Cargo.toml'
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - .config/nextest.toml
              - .github/runners/apt-install.sh
              - apps/**
              - packages/**
              - installer/**
              - templates/**
              - addons/builtins/**
              - tools/native-charts/**
              - addons/swoftymod/**
              - re/db/functions.tsv
              - tools/gamedb/catalog/**
            # The installer crate, its path dependencies (swofty-core, -addon, -formats, -sdk) and what they embed.
            installer:
              - *always
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - installer/**
              - packages/core/**
              - packages/addon-api/**
              - packages/formats/**
              - packages/sdk/**
              - tools/gamedb/catalog/**
              - templates/addon/native/include/**
              - addons/swoftymod/swofty.json
              - apps/launcher/assets/**
            native:
              - *always
              - native/**
              - re/**
              - addons/*/native/**
              - packages/sdk/**
              - tools/pack_addon.py
              - tools/rtassets.py
              - templates/std/**
              - tools/std/templates.py
              - .github/runners/apt-install.sh
            # build.py puts tools/ on the module path; the app imports erp, pkg and idf from there.
            swofty-ui:
              - *always
              - tools/swofty-ui/**
              - tools/erp.py
              - tools/pkg.py
              - tools/idf.py
            docs:
              - *always
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            # The registry schemas and examples, the tools that check them, and the templates whose data files they validate.
            std:
              - *always
              - packages/sdk/std/**
              - tools/std/**
              - templates/std/**
            compat:
              - *always
              - tools/compat/**

  # A push to main starts its heavy jobs on EC2 spot instances that take one job each and terminate
  # (.github/runners). A pull request from a branch of this repository does too once the repository variable
  # EC2_PULL_REQUESTS is true and the runner role trusts pull requests (.github/runners/README.md). Pull
  # requests from forks, and any launch that fails, get the hosted runner labels instead. Only the jobs the
  # change runs get an instance.
  ec2:
    name: EC2 runners
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      native: ${{ steps.launch.outputs.native || 'ubuntu-latest' }}
      rust-linux: ${{ steps.launch.outputs.rust-linux || 'ubuntu-latest' }}
      rust-windows: ${{ steps.launch.outputs.rust-windows || 'windows-latest' }}
      release-linux: ${{ steps.launch.outputs.release-linux || 'ubuntu-22.04' }}
      release-windows: ${{ steps.launch.outputs.release-windows || 'windows-latest' }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          ENABLED: ${{ vars.EC2_PULL_REQUESTS }}
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          WORK: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.native == 'true' }}
        run: |
          use=false
          if [ "$EVENT" = push ]; then use=true; fi
          if [ "$EVENT" = pull_request ] && [ "$ENABLED" = true ] && [ "$HEAD" = "$GITHUB_REPOSITORY" ] && [ "$WORK" = true ]; then use=true; fi
          echo "use=$use" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.use == 'true'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/runners

      - id: aws
        if: steps.gate.outputs.use == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::532818875494:role/swofty-launcher-ci-runners
          aws-region: ap-south-2

      # All at once. m8a has a whole core per vCPU; Windows pays for its licence per vCPU, so it stops at 16.
      - id: launch
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        env:
          NATIVE: ${{ needs.changes.outputs.native }}
          RUST: ${{ needs.changes.outputs.rust }}
          RELEASE: ${{ github.event_name == 'push' }}
        run: |
          linux=m8a.8xlarge,c8i.8xlarge,c7i.8xlarge,m8a.4xlarge
          windows=m8a.4xlarge,c8i.4xlarge,c7i.4xlarge
          if [ "$NATIVE" = true ]; then .github/runners/launch.sh native linux-2604 "$linux" ubuntu-latest & fi
          if [ "$RUST" = true ]; then
            .github/runners/launch.sh rust-linux linux-2604 "$linux" ubuntu-latest &
            .github/runners/launch.sh rust-windows windows "$windows" windows-latest &
          fi
          if [ "$RELEASE" = true ]; then
            .github/runners/launch.sh release-linux linux-2204 "$linux" ubuntu-22.04 &
            .github/runners/launch.sh release-windows windows "$windows" windows-latest &
          fi
          wait

  # The first answer on a change: formatting needs only the toolchain, so it reports within a minute.
  format:
    name: Rust format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - run: cargo fmt --all --check

  # Clippy runs beside the tests rather than before them, on hosted runners even for main: it is never the
  # longest job, and its check-only build has a cache of its own.
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          cache: clippy
          save: true

      # The launcher and the installer are not default members; --workspace reaches them too.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: Rust tests (${{ matrix.os }})
    needs: [changes, ec2]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os == 'windows-latest' && needs.ec2.outputs.rust-windows || needs.ec2.outputs.rust-linux }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # The tests write their fixtures to the temporary folder. On Windows that is on C:, which is several
      # times slower than the D: volume the job works on.
      - name: Temporary folder on the work volume
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-rust
        with:
          cache: test
          save: true
          nextest: true

      # --workspace takes in the launcher's and the installer's tests too. Building as a step of its own shows
      # the compile and the run apart in the timings.
      - name: Build the tests
        run: cargo nextest run --workspace --profile ci --no-run

      # Every test of every binary in one pool (.config/nextest.toml), with the slow ones listed at the end.
      # The real-file round trips skip without F1_25_DIR; CI has no game files.
      - name: Test
        run: cargo nextest run --workspace --profile ci

      - name: Upload the test times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ runner.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Doc tests
        run: cargo test --workspace --doc

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Native chart helper protocol
        shell: bash
        run: |
          cargo build -p swofty-addon --example native_charts
          python tools/native-charts/protocol-smoke.py target/debug/examples/native_charts

  swofty-ui:
    name: Swofty UI (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.swofty-ui == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Self-test from source
        run: python tools/swofty-ui/serve.py --self-test

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build the executable
        run: python tools/swofty-ui/build.py

      - name: Self-test the executable
        run: dist/swofty-ui/swofty-ui --self-test

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: swofty-ui-${{ runner.os }}
          path: dist/swofty-ui/swofty-ui*
          if-no-files-found: error
          retention-days: 14

  # The gate needs a game folder; its comparison logic runs here against a fake swofty.
  compat:
    name: Compatibility gate tool
    needs: changes
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s tools/compat/tests -t tools/compat

  # Clippy lints the installer on both systems; this job builds the release binary people test. On main the
  # release build makes it instead (release-binaries.yml), from the release cache.
  installer:
    name: Installer (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the release build's glibc baseline.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # The release cache main's release build saves, which holds the installer's dependencies too.
      - uses: ./.github/actions/setup-rust
        with:
          cache: release
          save: true
          system-libraries: false

      - name: Build
        run: cargo build --release -p swofty-launcher-installer

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            target/release/swofty-launcher-installer
            target/release/swofty-launcher-installer.exe
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          require-lockfile: true

      - name: Build
        run: pnpm --filter @f1modmanager/docs docs:build

  std:
    name: Standard library schemas
    needs: changes
    if: needs.changes.outputs.std == 'true'
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags: schemacheck reads the schema files of the last release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Schema tooling tests
        run: python3 -m unittest discover -s tools/std/tests

      # Schema files at the last v* tag before the merge base are released and must be unchanged; every new
      # minor may only add to the one before it, and every new major declares its adapter.
      - name: Schema versions
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 tools/std/schemacheck.py --released-before "$(git merge-base "$BASE" HEAD)"

      - name: Registry examples and must-fail cases
        run: python3 tools/std/validate.py

      # The native job builds the templates; this checks their registry data files against the schemas.
      - name: Template data files
        run: python3 tools/std/templates.py --no-build

  native:
    name: Native loader and Wine test
    needs: [changes, ec2]
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ needs.ec2.outputs.native }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      # The EC2 runner has a 150 GB root volume and Wine baked in. The hosted fallback has about 14 GB free,
      # which the Wine prefixes of the parallel tests fill, so it drops the preinstalled toolchains it never
      # uses, and it installs Wine and Xvfb. Only the Wine tests need either, so both run in the background
      # while the build does, and the step before the tests waits for them.
      - name: Start freeing disk space and installing Wine and Xvfb
        run: |
          (
            set +e
            if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
            fi
            sudo dpkg --add-architecture i386 && .github/runners/apt-install.sh wine64 wine xvfb
            echo $? > "$RUNNER_TEMP/wine-install.status"
          ) > "$RUNNER_TEMP/wine-install.log" 2>&1 &

      # The binding generator, capture and verifier tests use only the standard library.
      - name: RE tools unit tests
        run: python3 -m unittest discover -s re/tools/tests

      # The native scripts pin their compilers to the maintainer's healthy cores (taskset -c 2-7,...),
      # which leaves two of a hosted runner's four. This shim drops the pin and runs the command as is.
      - name: Use every runner core
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/taskset" <<'EOF'
          #!/bin/sh
          [ "$1" = -c ] && shift 2
          exec "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/taskset"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The native tests run side by side, and the stock xvfb-run -a can give two calls started together the
      # same display. This one takes the next display number from a counter under a lock.
      - name: Give every xvfb-run its own display
        run: |
          cat > "$RUNNER_TEMP/bin/xvfb-run" <<'EOF'
          #!/bin/bash
          while [ "${1:-}" = -a ] || [ "${1:-}" = --auto-servernum ]; do shift; done
          n=$(flock "$RUNNER_TEMP/xvfb.lock" bash -c 'f=$RUNNER_TEMP/xvfb.next; n=$(cat "$f" 2>/dev/null || echo 100); echo $((n + 1)) > "$f"; echo "$n"')
          Xvfb ":$n" -screen 0 1280x1024x24 -nolisten tcp >/dev/null 2>&1 &
          x=$!
          for _ in $(seq 200); do [ -S "/tmp/.X11-unix/X$n" ] && break; sleep 0.05; done
          DISPLAY=":$n" "$@"
          rc=$?
          kill "$x" 2>/dev/null
          wait "$x" 2>/dev/null
          exit $rc
          EOF
          chmod +x "$RUNNER_TEMP/bin/xvfb-run"

      # The scripts below keep their own Zig cache under native/build, which the restore step covers.
      # The tool cache installs Zig at the same path every run; the MinGW and libc++ objects are keyed
      # on compiler arguments that include that path, so the default random temp folder missed them all.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
          use-tool-cache: true

      # The key starts over each month so the content-addressed cache cannot grow without bound.
      - name: Zig cache period
        id: zig-period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Zig cache
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            native/build/zig-cache
          key: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-${{ hashFiles('native/**', 'addons/*/native/**', 'packages/sdk/include/**') }}
          restore-keys: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-

      # native/build.sh runs its compile graph with ninja.
      - name: Ninja
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/ninja.zip" https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          mkdir -p "$RUNNER_TEMP/ninja"
          python3 -m zipfile -e "$RUNNER_TEMP/ninja.zip" "$RUNNER_TEMP/ninja"
          chmod +x "$RUNNER_TEMP/ninja/ninja"
          echo "$RUNNER_TEMP/ninja" >> "$GITHUB_PATH"

      # Each template's native/build.sh keeps a Zig cache of its own, with its own libc++ and MinGW builds,
      # which the templates test rebuilds from nothing without this (seven minutes on a hosted runner). It is a
      # cache entry of its own so that the main one keeps its key and contents.
      - name: Restore the template Zig caches
        id: template-zig-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            templates/**/native/build/zig-cache
          key: zig-templates-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-${{ hashFiles('templates/**/native/**', 'packages/sdk/include/**') }}
          restore-keys: zig-templates-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-

      - name: Build version.dll and swofty_core.dll
        run: native/build.sh

      - name: Disk space, Wine and Xvfb
        timeout-minutes: 10
        run: |
          while [ ! -f "$RUNNER_TEMP/wine-install.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/wine-install.log"
          df -h /
          exit "$(cat "$RUNNER_TEMP/wine-install.status")"

      # Every host and Wine test, the templates build and the Any Team Transfers build, side by side; each
      # test's output is in its own group in the log, and the step fails on any failing test.
      - name: Native tests
        run: |
          df -h / "$RUNNER_TEMP"
          trap 'df -h / "$RUNNER_TEMP"' EXIT
          native/test/run_ci_tests.sh

      # Saved after the tests, which compile their fixtures into the same cache.
      - name: Save the Zig cache
        id: zig-save
        if: github.ref == 'refs/heads/main' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            native/build/zig-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      - name: Save the template Zig caches
        id: template-zig-save
        if: github.ref == 'refs/heads/main' && steps.template-zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            templates/**/native/build/zig-cache
          key: ${{ steps.template-zig-cache.outputs.cache-primary-key }}

      # Each saved Zig cache is about 3 GB and holds everything the one before it did, so only the newest of each
      # kind is kept; several of them push the Rust caches out of the repository's cache space.
      - name: Remove the older Zig caches
        if: steps.zig-save.outcome == 'success' || steps.template-zig-save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.zig-cache.outputs.cache-primary-key }}
          TEMPLATES: ${{ steps.template-zig-cache.outputs.cache-primary-key }}
        run: |
          for kind in "zig-$RUNNER_OS-:$MAIN" "zig-templates-$RUNNER_OS-:$TEMPLATES"; do
            KEEP=${kind#*:} gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "${kind%%:*}" --limit 100 \
              --json id,key --jq '.[] | select(.key != env.KEEP) | .id' | while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" && echo "removed cache $id"
            done
          done

  # Every push to main also builds the release binaries: the run keeps the release cache warm, and a tag on
  # this commit takes its binaries from here (release.yml) instead of building again.
  release-binaries:
    name: Release binaries
    needs: ec2
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-binaries.yml
    with:
      ref: ${{ github.sha }}
      retention-days: 7
      linux-runner: ${{ needs.ec2.outputs.release-linux }}
      windows-runner: ${{ needs.ec2.outputs.release-windows }}
      installer: true

  # Cleans up after every run that may have started instances. Release tags need this run to pass, so the
  # cleanup never fails it.
  ec2-cleanup:
    name: EC2 cleanup
    needs: [ec2, rust, native, release-binaries]
    if: always() && (github.event_name == 'push' || (vars.EC2_PULL_REQUESTS == 'true' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/runners

      - id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::532818875494:role/swofty-launcher-ci-runners
          aws-region: ap-south-2

      - if: steps.aws.outcome == 'success'
        continue-on-error: true
        run: .github/runners/cleanup.sh
