# cargo-nextest runs every test of every binary in one pool, each in its own process, instead of one test
# binary after another as cargo test does. CI runs `cargo nextest run --workspace --profile ci`; doc tests
# still run through `cargo test --doc`.

# Test priorities (the overrides below) need 0.9.91.
nextest-version = "0.9.91"

[profile.default]
# A test still running after 60 s is reported as slow, and stopped after 5 minutes so a hang fails the run.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
# No retries: a flaky test is a bug to fix, not to hide. Name one here with an override only while it is.
retries = 0
# Failing, slow and leaky tests (a leaky test leaves a child process holding its output open) are named in
# the log; every test's time is in target/nextest/ci/junit.xml, which CI keeps as an artefact.
status-level = "leak"
final-status-level = "leak"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

# The longest tests start first, so that none of them begins near the end of the run and holds it open. The
# encoder test compresses 12 MB at the archive zstd level (85 s on a hosted Windows runner); the integration
# tests named here take seconds each on Windows, where every one starts processes or writes many files.
[[profile.ci.overrides]]
filter = """
test(=games::f1_25::erp::tests::a_reused_encoder_writes_what_a_new_one_does)
| binary(saves_warning) | binary(career_vault) | binary(restore) | binary(std16_launcher)
| binary(addon_storage) | binary(launcher_saves)
"""
priority = 50

[profile.ci.junit]
path = "junit.xml"
